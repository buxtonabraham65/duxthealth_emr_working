{% extends "bases.html" %}
{% block content %}
  <h1>Confirm Delete Medication Sheet</h1>
  <p>Are you sure you want to delete this medication sheet for <strong>{{ medicationsheet.patient }}</strong>?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, Delete</button>
    <a href="{% url 'homecare:medicationsheet_list' %}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
