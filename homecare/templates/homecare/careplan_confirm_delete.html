{% extends 'bases.html' %}
{% block content %}
<div class="max-w-lg mx-auto mt-10 p-6 bg-white rounded-lg shadow-lg">
    <h2 class="text-xl font-semibold mb-4 text-red-600">Confirm Delete Care Plan</h2>
    <p class="mb-6">Are you sure you want to delete 
        <span class="font-bold">"{{ careplan.title }}"</span>?
    </p>

    <form method="post" class="flex gap-4">
        {% csrf_token %}
        <button type="submit" 
            class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded">
            Yes, Delete
        </button>
        <a href="{% url 'homecare:careplan_list' %}" 
           class="bg-gray-300 hover:bg-gray-400 text-black px-4 py-2 rounded">
            Cancel
        </a>
    </form>
</div>
{% endblock %}
