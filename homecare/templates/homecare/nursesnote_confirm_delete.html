{% extends "bases.html" %}
{% block content %}
  <h1>Confirm Delete Nurse Note</h1>
  <p>Are you sure you want to delete this nurse note for <strong>{{ nursesnote.patient }}</strong> created at {{ nursesnote.created_at|date:"Y-m-d H:i" }}?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, Delete</button>
    <a href="{% url 'homecare:nursesnote_list' %}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
