{% extends "bases.html" %}

{% block content %}
<div class="container mt-4">
    <h2 class="text-danger">⚠ Confirm Delete Doctor Note</h2>
    <p>
        Are you sure you want to delete this doctor note for 
        <strong>{{ doctornote.patient }}</strong> 
        created at {{ doctornote.created_at|date:"Y-m-d H:i" }}?
    </p>
    <form method="post" class="mt-3">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger me-2">🗑 Yes, Delete</button>
        <a href="{% url 'homecare:doctornote_list' %}" class="btn btn-secondary">↩ Cancel</a>
    </form>
</div>
{% endblock %}
