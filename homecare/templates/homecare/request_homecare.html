{% extends "frontend_base.html" %}
{% block title %}Request Homecare | DuxtHealth{% endblock %}

{% block content %}
<section class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">

                <h2 class="fw-bold mb-3 text-center">
                    Request Homecare Service
                </h2>

                <p class="text-center text-muted mb-4">
                    Fill the form below and our healthcare team will contact you shortly.
                </p>

                <form method="post" class="card p-4 shadow-sm">
                    {% csrf_token %}
                    {{ form.as_p }}

                    <div class="text-center mt-3">
                        <button class="btn btn-primary btn-lg">
                            Submit Request
                        </button>
                    </div>
                </form>

            </div>
        </div>
    </div>
</section>
{% endblock %}
