{% extends "bases.html" %}
{% block content %}

<style>
  /* =======================
     NURSE NOTE FORM – DUXTHEALTH
  ======================= */

  .form-card {
    max-width: 750px;
    margin: 40px auto;
    padding: 28px;
    background: #ffffff;
    border-radius: 14px;
    box-shadow: 0 12px 30px rgba(0,0,0,.08);
  }

  .form-card h2 {
    text-align: center;
    margin-bottom: 24px;
    font-weight: 700;
    color: var(--duxt-primary);
  }

  .form-card label {
    font-weight: 600;
    margin-bottom: 6px;
    display: block;
    color: var(--duxt-dark);
    font-size: 0.95rem;
  }

  .form-card input,
  .form-card textarea,
  .form-card select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 0.95rem;
    transition: border-color .2s ease, box-shadow .2s ease;
  }

  .form-card textarea {
    resize: vertical;
  }

  .form-card input:focus,
  .form-card textarea:focus,
  .form-card select:focus {
    outline: none;
    border-color: var(--duxt-primary);
    box-shadow: 0 0 0 3px rgba(14,111,108,.15);
  }

  .btn-duxt {
    display: inline-block;
    padding: 12px 20px;
    background: linear-gradient(135deg, var(--duxt-primary), #0b5c59);
    color: #ffffff;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: transform .15s ease, box-shadow .15s ease;
    text-decoration: none;
  }

  .btn-duxt:hover {
    transform: translateY(-1px);
    box-shadow: 0 8px 20px rgba(0,0,0,.12);
  }

  .btn-outline-duxt {
    display: inline-block;
    padding: 12px 20px;
    border: 2px solid var(--duxt-primary);
    color: var(--duxt-primary);
    background: transparent;
    border-radius: 10px;
    font-weight: 600;
    text-decoration: none;
    transition: all .2s ease;
  }

  .btn-outline-duxt:hover {
    background: var(--duxt-primary);
    color: #ffffff;
  }

  .form-actions {
    margin-top: 25px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
</style>

<div class="form-card">

  <h2>
    {% if form.instance.pk %}
      ✏️ Edit Nurse Note
    {% else %}
      ➕ Add Nurse Note
    {% endif %}
  </h2>

  <form method="post" novalidate>
    {% csrf_token %}

    {{ form.as_p }}

    <div class="form-actions">
      <button type="submit" class="btn-duxt">
        💾 Save
      </button>

      <a href="{% url 'homecare:nursesnote_list' %}" class="btn-outline-duxt">
        ← Cancel
      </a>
    </div>

  </form>

</div>

{% endblock %}
